name: ekt-match

services:
  backend:
    image: ${BACKEND_IMAGE:-${APP_IMAGE:-ekt-match-backend:local}}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    init: true
    restart: unless-stopped
    expose:
      - "${PORT:-3001}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      APP_MODE: ${APP_MODE:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-}
      EKT_API_USERNAME: ${EKT_API_USERNAME:-}
      EKT_API_PASSWORD: ${EKT_API_PASSWORD:-}
      EKT_PRODUCT_DETAIL_URL: ${EKT_PRODUCT_DETAIL_URL:-}
      CATALOG_PATH: ${CATALOG_PATH:-}
      CART_URL: ${CART_URL:-}

  frontend:
    image: ${FRONTEND_IMAGE:-ekt-match-frontend:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: frontend
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:${PORT:-3001}}
